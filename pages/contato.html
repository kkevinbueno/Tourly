<header>

<section class="page-hero"><h1>Fale Conosco</h1><p>Dúvidas, sugestões ou um roteiro sob medida? Escreva pra gente.</p></section>
<main class="container narrow">
  <div class="panel">
    <img class="banner" src="../png/contato.png" alt="Ilustração de mapa com roteiro e envelope">
    <form id="formContato">
      <label>Nome<input type="text" id="nome" placeholder="Seu nome" required></label>
      <label>E-mail<input type="email" id="email" placeholder="voce@email.com" required></label>
      <label>Mensagem<textarea id="mensagem" rows="5" placeholder="Como podemos ajudar?" required></textarea></label>
      <button class="btn" type="submit">Enviar mensagem</button>
    </form>
  </div>
</main>

<footer>
  <div><img class="logo-img" src="../png/logo.png" alt=""> <b>Tourly</b> · Sua melhor agência de viagens.</div>
